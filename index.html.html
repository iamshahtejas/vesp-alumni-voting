<!doctype html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>Distinguished Alumni Award</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:only light;
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#1D2736; --muted:#566172; --line:#DDE1E7;
  --accent:#1F3A5F; --accent-soft:#E9EFF6; --star:#C8890F; --star-empty:#D7DBE2; --on-accent:#FFFFFF;
  --warn:#7A4B00; --warn-soft:#FBF1DD;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,p,dl,dd{margin:0}

.shell{height:100vh;height:100dvh;display:grid;grid-template:"top" auto "main" minmax(0,1fr) "dock" auto/minmax(0,1fr);background:var(--bg)}
.top{grid-area:top;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
.top-row{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 16px 8px}
.top-title{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.25}
.top-title small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.save{margin-left:8px}
.save button{border:0;background:none;padding:4px 2px;font-size:13px;color:var(--accent);font-weight:600;text-decoration:underline}
.list-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;padding:2px 12px;font-size:15px;font-weight:500;white-space:nowrap}
.bar{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s ease}

.side{display:none;grid-area:side;background:var(--surface);border-right:1px solid var(--line);overflow:auto}
.main{grid-area:main;overflow:auto;-webkit-overflow-scrolling:touch;outline:0}
.page{max-width:760px;margin:0 auto;padding:18px 16px 26px}

.person{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px 14px;align-items:start}
.person .name{grid-column:1/-1}
.mini{display:grid;gap:7px}
.mini dt{color:var(--muted);font-size:14px;line-height:1.25}
.mini dd{font-weight:500;line-height:1.3;overflow-wrap:break-word}
.photo{width:100%;aspect-ratio:4/5;border-radius:6px;object-fit:cover;object-position:50% 20%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);font:600 32px var(--display)}
.name{font:600 28px/1.14 var(--display);overflow-wrap:break-word}
.position{color:var(--muted);font-size:14px;margin-bottom:6px}
.facts{margin-top:16px;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}
.fact dt{color:var(--muted);font-size:15px}
.fact dd{font-weight:500;overflow-wrap:anywhere}
.fact a{color:var(--accent)}
.section-title{font-weight:600;font-size:16px;margin:22px 0 5px}
.statement{white-space:pre-wrap;overflow-wrap:anywhere;max-width:68ch}

.dock{grid-area:dock;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));touch-action:manipulation}
.rate{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;align-items:center;max-width:760px;margin:0 auto}
.stars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-radius:6px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.star{position:relative;display:block;height:46px;padding:3px;cursor:pointer}
.star svg{display:block;width:100%;height:100%;overflow:visible}
.star .empty polygon{fill:var(--star-empty)}
.star .full{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);clip-path:inset(0 100% 0 0)}
.star[data-f="half"] .full{clip-path:inset(0 50% 0 0)}
.star[data-f="on"] .full{clip-path:inset(0 0 0 0)}
.star .full polygon{fill:var(--star)}
.star.pop{animation:pop .16s ease-out}
@keyframes pop{50%{transform:scale(1.14)}}
.stars[aria-disabled="true"]{opacity:.35;pointer-events:none}
.score{text-align:center}
.score-num{font:600 34px/1 var(--display);color:var(--accent)}
.score-num.none{color:var(--muted);font:500 15px/1.2 var(--body)}
.score-of{font-size:13px;color:var(--muted);margin-left:2px;font-family:var(--body)}
.step{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.step button{height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-size:15px}
.step button:disabled{opacity:.4}
.nav{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:8px;max-width:760px;margin:10px auto 0}
.btn{min-height:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:6px 14px;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.45}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);font-weight:500;padding:6px 8px}
.btn.block{width:100%}

.hello{font:600 34px/1.12 var(--display);overflow-wrap:anywhere}
.lead{margin-top:10px;max-width:60ch}
.closes{margin-top:6px;color:var(--muted)}
.scale{margin-top:20px;border-top:1px solid var(--line)}
.scale div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.scale b{font:600 21px/1.2 var(--display);color:var(--accent)}
.guide{margin-top:18px;padding-left:20px}
.guide li{margin-bottom:6px}

.rows{margin-top:16px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:56px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.row-name{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.row-sub{display:block;color:var(--muted);font-size:14px;line-height:1.3}
.row-score{font:600 22px/1 var(--display);color:var(--accent);white-space:nowrap}
.row-score.none{font:500 14px/1.2 var(--body);color:var(--muted)}
.callout{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--accent-soft);border:1px solid #BFD0E3;color:var(--accent);font-weight:600;line-height:1.4}
.callout span{display:block}
.notice{margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--warn);font-size:15px}

.side .row{padding:9px 16px}
.side .row[aria-current="true"]{background:var(--accent-soft)}
.side-head{padding:14px 16px 8px;font-weight:600;font-size:15px}

.overlay{position:fixed;inset:0;background:rgba(29,39,54,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:520px;max-height:82%;display:flex;flex-direction:column;background:var(--surface);border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h2{font:600 24px/1.2 var(--display)}
.sheet p{margin-top:8px}
.sheet-list{overflow:auto;margin:10px -16px 0}
.sheet-list .row{padding:9px 16px}
.sheet-list .row[aria-current="true"]{background:var(--accent-soft)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}

.center{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.center h1{font:600 30px/1.15 var(--display)}
.center p{margin:10px auto 0;max-width:42ch;color:var(--muted)}
.center .btn{margin-top:18px}

@media (min-width:640px){
  .stars{grid-template-columns:repeat(10,minmax(0,1fr))}
  .star{height:50px}
  .rate{grid-template-columns:minmax(0,1fr) 112px}
  .person{grid-template-columns:150px minmax(0,1fr);gap:14px 20px}
  .mini{gap:12px}
  .name{font-size:36px}
  .fact{grid-template-columns:150px minmax(0,1fr);gap:20px}
  .page{padding-top:26px}
}
@media (min-width:980px){
  .shell{grid-template:"top top" auto "side main" minmax(0,1fr) "side dock" auto/300px minmax(0,1fr)}
  .side{display:block}
  .list-btn{display:none}
  .sheet{border-radius:12px;margin-bottom:12vh}
  .overlay{align-items:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

<div id="app"></div>
<script>
(function () {
  'use strict';
  /* For a hosted copy, replace the text below with the web app link ending in /exec. */
  var API_URL = 'https://script.google.com/macros/s/AKfycbwU--wjC_29miM0FzcEEvqSYoSevD8b1PKGXg-X5jqsb6i3qTJoOnOdSrRLy0QWN6PlUQ/exec';
  var inAppsScript = !!(window.google && google.script && google.script.run);
  var CODE = inAppsScript ? (document.body.dataset.code || '') : (new URLSearchParams(location.search).get('k') || '');
  var app = document.getElementById('app');
  var S = { d: null, view: 'loading', i: 0, v: {}, photos: {}, q: {}, busy: false, failed: false, timer: null, retry: null };

  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!inAppsScript) {
      return fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: name, args: args })
      }).then(function (res) {
        if (!res.ok) throw new Error('Request failed');
        return res.json();
      }).then(function (res) {
        if (res.error) throw new Error(res.error);
        return res.data;
      });
    }
    return new Promise(function (resolve, reject) {
      var runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      runner[name].apply(runner, args);
    });
  }

  function el(tag, props) {
    var node = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (key) {
      var val = props[key];
      if (val === null || val === undefined || val === false) return;
      if (key === 'text') node.textContent = val;
      else if (key === 'cls') node.className = val;
      else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), val);
      else node.setAttribute(key, val);
    });
    for (var a = 2; a < arguments.length; a++) {
      var kid = arguments[a];
      if (kid === null || kid === undefined || kid === false) continue;
      (Array.isArray(kid) ? kid : [kid]).forEach(function (k) { if (k) node.appendChild(k); });
    }
    return node;
  }

  /* Five-pointed star on a 100 x 100 box. */
  var starPoints = (function () {
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var r = i % 2 ? 21 : 50;
      var t = Math.PI * i / 5 - Math.PI / 2;
      pts.push([(50 + r * Math.cos(t)).toFixed(2), (52 + r * Math.sin(t)).toFixed(2)]);
    }
    return pts;
  })();
  var svgNS = 'http://www.w3.org/2000/svg';
  function svg(cls, polygons) {
    var s = document.createElementNS(svgNS, 'svg');
    s.setAttribute('viewBox', '0 0 100 100');
    s.setAttribute('class', cls);
    s.setAttribute('aria-hidden', 'true');
    polygons.forEach(function (p) {
      var g = document.createElementNS(svgNS, 'polygon');
      g.setAttribute('points', p.points);
      if (p.cls) g.setAttribute('class', p.cls);
      s.appendChild(g);
    });
    return s;
  }
  function makeStar(n) {
    var outline = { points: starPoints.map(function (p) { return p.join(','); }).join(' ') };
    var star = el('span', { cls: 'star', 'data-n': n });
    star.appendChild(svg('empty', [outline]));
    star.appendChild(svg('full', [outline]));
    return star;
  }

  function nominees() { return S.d.nominees; }
  function current() { return nominees()[S.i]; }
  function isDone(id) { var v = S.v[id]; return !!(v && (v.recused || v.score)); }
  function doneCount() { return nominees().filter(function (n) { return isDone(n.id); }).length; }
  function fmt(score) { return Number.isInteger(score) ? String(score) : score.toFixed(1); }
  function initials(name) {
    return name.replace(/\b(Dr|Mr|Mrs|Ms|Prof|Er)\b\.?/gi, ' ').trim().split(/\s+/).slice(0, 2)
      .map(function (w) { return w.charAt(0).toUpperCase(); }).join('');
  }
  function subline(n) { return [n.course, n.batch].filter(Boolean).join(', batch of '); }

  /* Saving: one request at a time, always the latest value for each nominee. */
  function queueSave(id) {
    S.q[id] = S.v[id];
    paintSave('saving');
    clearTimeout(S.timer);
    S.timer = setTimeout(pump, 350);
  }
  function drain() {
    clearTimeout(S.timer);
    pump();
    return new Promise(function (resolve, reject) {
      (function wait() {
        if (!Object.keys(S.q).length && !S.busy) return resolve();
        if (S.failed && !S.busy) return reject(new Error('unsaved'));
        setTimeout(wait, 120);
      })();
    });
  }
  function pump() {
    if (S.busy) return;
    var ids = Object.keys(S.q);
    if (!ids.length) { S.failed = false; paintSave('saved'); return; }
    var id = ids[0];
    var val = S.q[id];
    S.busy = true;
    paintSave('saving');
    call('saveVote', CODE, id, val.score || null, !!val.recused).then(function (res) {
      S.busy = false;
      if (S.q[id] === val) delete S.q[id];
      if (res && res.ok === false) {
        if (res.reason === 'nominee' || res.reason === 'score') { S.failed = true; paintSave('failed'); return; }
        load();
        return;
      }
      S.failed = false;
      pump();
    }).catch(function () {
      S.busy = false;
      S.failed = true;
      paintSave('failed');
      clearTimeout(S.retry);
      S.retry = setTimeout(pump, 6000);
    });
  }
  function paintSave(state) {
    var box = document.getElementById('save');
    if (!box) return;
    box.textContent = '';
    if (state === 'saving') box.textContent = 'Saving';
    if (state === 'saved') box.textContent = 'Saved';
    if (state === 'failed') {
      box.appendChild(document.createTextNode('Not saved. '));
      box.appendChild(el('button', { text: 'Try again', onclick: pump }));
    }
  }

  /* Rating */
  function setVote(id, value) {
    S.v[id] = value;
    queueSave(id);
    paintRating();
    paintLists();
    paintProgress();
  }
  function tapStar(n, node) {
    var id = current().id;
    var v = S.v[id] || {};
    if (v.recused) return;
    var next = v.score === n ? n - 0.5 : n;
    setVote(id, { score: next, recused: false });
    if (node) {
      node.classList.remove('pop');
      void node.getBoundingClientRect();
      node.classList.add('pop');
    }
  }
  function stepBy(delta) {
    var id = current().id;
    var v = S.v[id] || {};
    if (v.recused) return;
    var next = Math.min(10, Math.max(0.5, (v.score || 0) + delta));
    setVote(id, { score: next, recused: false });
  }

  function paintRating() {
    var box = document.getElementById('rate');
    if (!box) return;
    var n = current();
    var v = S.v[n.id] || {};
    var score = v.score || 0;
    var stars = box.querySelector('.stars');
    stars.setAttribute('aria-valuenow', score);
    stars.setAttribute('aria-valuetext', v.recused ? 'Recused' : score ? fmt(score) + ' out of 10' : 'Not rated');
    stars.setAttribute('aria-disabled', v.recused ? 'true' : 'false');
    Array.prototype.forEach.call(box.querySelectorAll('.star'), function (s) {
      var i = Number(s.dataset.n);
      s.dataset.f = score >= i ? 'on' : score === i - 0.5 ? 'half' : 'off';
    });
    var num = box.querySelector('.score-num');
    num.textContent = '';
    num.className = 'score-num' + (score ? '' : ' none');
    if (v.recused) num.textContent = 'Recused';
    else if (score) { num.textContent = fmt(score); num.appendChild(el('span', { cls: 'score-of', text: '/ 10' })); }
    else num.textContent = 'Not rated';
    box.querySelector('[data-step="-1"]').disabled = !!v.recused || !score || score <= 0.5;
    box.querySelector('[data-step="1"]').disabled = !!v.recused || score >= 10;
    var recuse = document.getElementById('recuse');
    if (recuse) recuse.textContent = v.recused ? 'Undo recusal' : 'Recuse';
    var next = document.getElementById('next');
    if (next) {
      next.textContent = S.i === nominees().length - 1 ? 'Review ratings' : 'Next nominee';
      next.className = 'btn ' + (isDone(n.id) ? 'primary' : '');
    }
  }
  function paintProgress() {
    var count = doneCount();
    var total = nominees().length;
    var label = document.getElementById('count');
    if (label) label.textContent = count + ' of ' + total + ' rated';
    var bar = document.getElementById('bar');
    if (bar) bar.style.width = (total ? 100 * count / total : 0) + '%';
  }

  /* Lists */
  function scoreLabel(n) {
    var v = S.v[n.id] || {};
    if (v.recused) return el('span', { cls: 'row-score none', text: 'Recused' });
    if (v.score) return el('span', { cls: 'row-score', text: fmt(v.score) });
    return el('span', { cls: 'row-score none', text: 'Not rated' });
  }
  function nomineeRow(n, index, onPick) {
    var isCurrent = S.view === 'nominee' && S.i === index;
    return el('button', { cls: 'row', type: 'button', 'aria-current': isCurrent ? 'true' : 'false',
      onclick: function () { onPick(index); } },
      el('span', {}, el('span', { cls: 'row-name', text: n.name }), el('span', { cls: 'row-sub', text: subline(n) })),
      scoreLabel(n));
  }
  function paintLists() {
    var side = document.getElementById('side-list');
    if (!side) return;
    side.textContent = '';
    nominees().forEach(function (n, i) { side.appendChild(nomineeRow(n, i, openNominee)); });
  }

  /* Shell shared by the home, nominee and review screens */
  function shell(mainKids, dock) {
    app.textContent = '';
    var main = el('main', { cls: 'main', id: 'main', tabindex: '-1' }, el('div', { cls: 'page' }, mainKids));
    var top = el('header', { cls: 'top' },
      el('div', { cls: 'top-row' },
        el('div', { cls: 'top-title', text: S.d.title },
          el('small', {}, el('span', { id: 'count' }), el('span', { cls: 'save', id: 'save', role: 'status' }))),
        el('button', { cls: 'list-btn', type: 'button', text: 'All nominees', onclick: openListSheet })),
      el('div', { cls: 'bar' }, el('i', { id: 'bar' })));
    var side = el('aside', { cls: 'side', 'aria-label': 'All nominees' },
      el('div', { cls: 'side-head' },
        el('button', { cls: 'btn quiet', type: 'button', text: 'How to rate', onclick: home }),
        el('button', { cls: 'btn quiet', type: 'button', text: 'Review and submit', onclick: review })),
      el('div', { id: 'side-list' }));
    app.appendChild(el('div', { cls: 'shell' }, top, side, main, dock));
    paintLists();
    paintProgress();
    main.scrollTop = 0;
  }

  function home() {
    S.view = 'home';
    var first = nominees().findIndex(function (n) { return !isDone(n.id); });
    var started = doneCount() > 0;
    var kids = [
      el('h1', { cls: 'hello', text: 'Voting as ' + S.d.memberName }),
      el('p', { cls: 'lead', text: 'Please rate all ' + nominees().length + ' nominees out of 10. Scores stay hidden until voting closes.' }),
      el('p', { cls: 'closes', text: 'Voting closes on ' + S.d.closes + '.' }),
      el('ul', { cls: 'guide' },
        el('li', { text: 'Tap a star to rate. Tap the same star again for a half star.' }),
        el('li', { text: 'Your ratings save as you go, so you can stop and come back with this link.' }),
        el('li', { text: 'Use Recuse if you nominated this person or know them too closely.' })),
      el('div', { cls: 'scale', 'aria-label': 'What the scores mean' },
        el('div', {}, el('b', { text: '9 to 10' }), el('span', { text: 'One of the strongest cases we could honour' })),
        el('div', {}, el('b', { text: '7 to 8' }), el('span', { text: 'A strong case for the award' })),
        el('div', {}, el('b', { text: '5 to 6' }), el('span', { text: 'Respected alumnus, but not award level yet' })),
        el('div', {}, el('b', { text: 'Under 5' }), el('span', { text: 'The case made here is weak' })))
    ];
    var dock = el('footer', { cls: 'dock' }, el('button', {
      cls: 'btn primary block', type: 'button', text: started ? 'Continue rating' : 'Start rating',
      onclick: function () {
        if (first < 0) review(); else openNominee(first);
      }
    }));
    shell(kids, dock);
    paintSave('');
  }

  function openNominee(index) {
    S.i = index;
    S.view = 'nominee';
    var n = current();
    var mini = [['Current role', n.occupation], ['Course', n.course], ['Batch', n.batch]]
      .filter(function (f) { return f[1]; })
      .map(function (f) { return el('div', {}, el('dt', { text: f[0] }), el('dd', { text: f[1] })); });
    var nominator = n.type === 'Self' ? 'Self-nominated' : [n.nominatedBy, n.relationship].filter(Boolean).join(', ');
    var facts = nominator ? [el('div', { cls: 'fact' }, el('dt', { text: 'Nominated by' }), el('dd', { text: nominator }))] : [];
    if (n.linkedin) {
      facts.push(el('div', { cls: 'fact' }, el('dt', { text: 'LinkedIn' }),
        el('dd', {}, el('a', { href: n.linkedin, target: '_blank', rel: 'noopener', text: 'Open profile' }))));
    }
    var photo = el('div', { cls: 'photo', id: 'photo', text: initials(n.name), role: 'img', 'aria-label': n.name });
    var kids = [
      el('p', { cls: 'position', text: 'Nominee ' + (index + 1) + ' of ' + nominees().length }),
      el('div', { cls: 'person' },
        el('h1', { cls: 'name', text: n.name, tabindex: '-1', id: 'name' }),
        photo,
        el('dl', { cls: 'mini' }, mini)),
      el('dl', { cls: 'facts' }, facts),
      el('h2', { cls: 'section-title', text: 'How they can contribute to VESP' }),
      el('p', { cls: 'statement', text: n.contribution || 'Nothing was entered in the form.' })
    ];

    var stars = el('div', {
      cls: 'stars', role: 'slider', tabindex: '0', 'aria-label': 'Rating out of 10',
      'aria-valuemin': '0', 'aria-valuemax': '10', 'aria-valuenow': '0',
      onclick: function (e) {
        var star = e.target.closest ? e.target.closest('.star') : null;
        if (star) tapStar(Number(star.dataset.n), star);
      },
      onkeydown: function (e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); stepBy(0.5); }
        if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); stepBy(-0.5); }
      }
    });
    for (var s = 1; s <= 10; s++) stars.appendChild(makeStar(s));

    var dock = el('footer', { cls: 'dock' },
      el('div', { cls: 'rate', id: 'rate' }, stars,
        el('div', { cls: 'score' },
          el('div', { cls: 'score-num', 'aria-live': 'polite' }),
          el('div', { cls: 'step' },
            el('button', { type: 'button', 'data-step': '-1', text: '−½', 'aria-label': 'Half a star less', onclick: function () { stepBy(-0.5); } }),
            el('button', { type: 'button', 'data-step': '1', text: '+½', 'aria-label': 'Half a star more', onclick: function () { stepBy(0.5); } })))),
      el('div', { cls: 'nav' },
        el('button', { cls: 'btn', type: 'button', text: 'Back', onclick: function () {
          if (S.i > 0) openNominee(S.i - 1); else home();
        } }),
        el('button', { cls: 'btn quiet', id: 'recuse', type: 'button', onclick: recusePrompt }),
        el('button', { cls: 'btn', id: 'next', type: 'button', onclick: function () {
          if (S.i < nominees().length - 1) openNominee(S.i + 1); else review();
        } })));

    shell(kids, dock);
    paintRating();
    showPhoto(n);
    if (nominees()[index + 1]) loadPhoto(nominees()[index + 1]);
    var heading = document.getElementById('name');
    if (heading) heading.focus({ preventScroll: true });
    paintSave(Object.keys(S.q).length ? 'saving' : '');
  }

  function loadPhoto(n) {
    if (!n.hasPhoto) return Promise.resolve(null);
    if (S.photos[n.id] === undefined) {
      S.photos[n.id] = call('getPhoto', CODE, n.id).catch(function () { delete S.photos[n.id]; return null; });
    }
    return S.photos[n.id];
  }
  function showPhoto(n) {
    loadPhoto(n).then(function (src) {
      if (!src || S.view !== 'nominee' || current().id !== n.id) return;
      var slot = document.getElementById('photo');
      if (!slot) return;
      slot.replaceWith(el('img', { cls: 'photo', id: 'photo', src: src, alt: 'Photograph of ' + n.name }));
    });
  }

  function recusePrompt() {
    var n = current();
    var v = S.v[n.id] || {};
    if (v.recused) { setVote(n.id, { score: null, recused: false }); return; }
    modal('Recuse from ' + n.name + '?',
      'Use this if you nominated this person or are close to them. Any rating you gave will be removed.',
      'Recuse', function () { setVote(n.id, { score: null, recused: true }); });
  }

  function modal(title, body, action, onConfirm) {
    var close = function () { overlay.remove(); };
    var overlay = el('div', { cls: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': title,
      onclick: function (e) { if (e.target === overlay) close(); },
      onkeydown: function (e) { if (e.key === 'Escape') close(); } },
      el('div', { cls: 'sheet' },
        el('h2', { text: title }), el('p', { text: body }),
        el('div', { cls: 'actions' },
          el('button', { cls: 'btn', type: 'button', text: 'Cancel', onclick: close }),
          el('button', { cls: 'btn primary', type: 'button', text: action, onclick: function () { close(); onConfirm(); } }))));
    document.body.appendChild(overlay);
    overlay.querySelector('.btn').focus();
  }

  function openListSheet() {
    var close = function () { overlay.remove(); };
    var pick = function (index) { close(); openNominee(index); };
    var overlay = el('div', { cls: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'All nominees',
      onclick: function (e) { if (e.target === overlay) close(); },
      onkeydown: function (e) { if (e.key === 'Escape') close(); } },
      el('div', { cls: 'sheet' },
        el('h2', { text: 'All nominees' }),
        el('div', { cls: 'sheet-list' }, nominees().map(function (n, i) { return nomineeRow(n, i, pick); })),
        el('div', { cls: 'actions' },
          el('button', { cls: 'btn', type: 'button', text: 'Close', onclick: close }),
          el('button', { cls: 'btn primary', type: 'button', text: 'Review ratings', onclick: function () { close(); review(); } }))));
    document.body.appendChild(overlay);
    overlay.querySelector('.btn').focus();
  }

  function review() {
    S.view = 'review';
    var items = nominees().map(function (n, i) { return { n: n, i: i, v: S.v[n.id] || {} }; });
    var rank = function (x) { return x.v.recused ? -1 : x.v.score ? x.v.score : 99; };
    items.sort(function (a, b) { return rank(b) - rank(a); });

    var counts = {};
    items.forEach(function (x) { if (x.v.score) counts[x.v.score] = (counts[x.v.score] || 0) + 1; });
    var crowded = Object.keys(counts).map(Number).filter(function (s) { return counts[s] >= 3; }).sort(function (a, b) { return b - a; })[0];
    var left = nominees().length - doneCount();

    var kids = [
      el('h1', { cls: 'hello', text: 'Review your ratings' }),
      el('p', { cls: 'callout' },
        left ? el('span', { text: left + (left === 1 ? ' nominee still needs' : ' nominees still need') + ' a rating.' }) : null,
        el('span', { text: 'Tap any name to change a rating.' }),
        el('span', { text: 'You cannot change ratings after submitting.' })),
      crowded ? el('p', { cls: 'notice', text: counts[crowded] + ' nominees share a score of ' + fmt(crowded) + '. Separate them if you can, because awards are limited.' }) : null,
      el('div', { cls: 'rows' }, items.map(function (x) { return nomineeRow(x.n, x.i, openNominee); }))
    ];
    var dock = el('footer', { cls: 'dock' }, el('button', {
      cls: 'btn primary block', type: 'button', id: 'submit', disabled: left > 0 ? 'disabled' : null,
      text: left ? 'Rate ' + left + ' more to submit' : 'Submit my ratings',
      onclick: function () {
        modal('Submit your ratings?', 'You cannot change your ratings after this.', 'Submit', submit);
      }
    }));
    shell(kids, dock);
    paintSave(Object.keys(S.q).length ? 'saving' : '');
  }

  function submit() {
    var button = document.getElementById('submit');
    if (button) { button.disabled = true; button.textContent = 'Submitting'; }
    drain().then(function () { return call('submitBallot', CODE); }).then(load).catch(function () {
      if (button) { button.disabled = false; button.textContent = 'Submit my ratings'; }
      paintSave('failed');
    });
  }

  function message(title, body, retry) {
    app.textContent = '';
    app.appendChild(el('div', { cls: 'center' }, el('div', {},
      el('h1', { text: title }), el('p', { text: body }),
      retry ? el('button', { cls: 'btn primary', type: 'button', text: 'Try again', onclick: load }) : null)));
  }

  function load() {
    message('Loading nominees', 'This can take a few seconds.');
    call('getBallot', CODE).then(function (d) {
      S.d = d;
      if (d.state === 'invalid') return message('This link is not valid', 'Ask the award coordinator for your personal voting link.');
      if (d.state === 'notopen') return message('Voting has not opened yet', 'Please use this same link once voting opens.');
      if (d.state === 'closed') return message('Voting has closed', 'Voting closed on ' + d.closes + '.');
      if (d.state === 'submitted') return message('Thank you, ' + d.memberName, 'Your ratings have been submitted.');
      if (!d.nominees.length) return message('No nominees yet', 'Please check back once the list is ready.');
      S.v = d.votes || {};
      S.q = {};
      home();
    }).catch(function () {
      message('The nominees did not load', 'Check your connection and try again.', true);
    });
  }

  load();
})();
</script>
</body>
</html>
